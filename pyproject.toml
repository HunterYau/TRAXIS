[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "traxis"
version = "0.1.0"
description = "Guided-wave material-loss tomography experiments"
requires-python = ">=3.12"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2", "psutil>=6,<8"]

[project.optional-dependencies]
learning = ["torch>=2.5,<3"]
plots = ["matplotlib>=3.9,<4"]
meshing = ["gmsh>=4.15.2,<5"]
highorder = ["ngsolve==6.2.2606"]

[project.scripts]
traxis = "traxis.cli:main"

[tool.setuptools.packages.find]
include = ["traxis*"]

